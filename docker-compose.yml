services:
  api:
    build:
      context: ./local_platform
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      WA_DATA_DB_PATH: /app/local_data/strategy.db
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-harsh.jaiswal@anibrain.com}
      WA_DATA_DIR: /app/local_data
      WA_BACKUP_DIR: /app/backups
      WA_BACKUP_INTERVAL_SECONDS: ${WA_BACKUP_INTERVAL_SECONDS:-3600}
      WA_BACKUP_MIRROR_FILES: ${WA_BACKUP_MIRROR_FILES:-1}
      WA_REQUIRE_BACKUP_BEFORE_DELETE: ${WA_REQUIRE_BACKUP_BEFORE_DELETE:-1}
      # Optional: POST a JSON alert here on backup failure (and on recovery).
      # Leave blank to disable. Slack/Discord/Teams/healthchecks.io all work.
      WA_BACKUP_ALERT_WEBHOOK: ${WA_BACKUP_ALERT_WEBHOOK:-}
      WA_BACKUP_ALERT_MIN_FAILURES: ${WA_BACKUP_ALERT_MIN_FAILURES:-1}
      FILE_URL_TTL_SECONDS: ${FILE_URL_TTL_SECONDS:-900}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      MAX_WORKSPACE_STORAGE_BYTES: ${MAX_WORKSPACE_STORAGE_BYTES:-16106127360}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-WhatsApp Strategy Canvas}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
    volumes:
      - app_data:/app/local_data
      # Host bind-mount: backups must outlive the Docker volumes they protect.
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./whatsapp-frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
