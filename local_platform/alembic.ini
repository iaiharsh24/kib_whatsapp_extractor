# Alembic config for the WhatsApp Strategy Canvas.
# env.py does the real wiring (engine + metadata come from the app's db module),
# so this file stays minimal. Run from local_platform/:  alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.warn_placeholder = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
